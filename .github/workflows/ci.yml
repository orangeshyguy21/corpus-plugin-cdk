name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: orangeshyguy21/corpus
          path: corpus
          token: ${{ secrets.CORPUS_PLUGIN_TOKEN }}
      - run: scripts/conformance.sh "$GITHUB_WORKSPACE/corpus"

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n plugin arena.sh faucet.sh tools/build-tools.sh scripts/*.sh
      - run: docker build --tag corpus-cdk-agent:ci --file arena/agent.Dockerfile arena
